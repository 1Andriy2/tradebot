[project]
name = "tradebot"
version = "0.1.0"
description = "Learning project: an AI agent that paper-trades crypto futures on a demo venue"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ccxt>=4.4",
    "pandas>=2.2",
    "numpy>=1.26,<2.3",
    "pyarrow>=16",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "httpx>=0.27",
]

[project.optional-dependencies]
ml = [
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "optuna>=3.6",
]
rl = [
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "torch>=2.4",
]
db = [
    "supabase>=2.5",
]

[project.scripts]
tradebot = "tradebot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradebot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM108"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# CPU-only PyTorch on Linux (CI/cron/Docker): avoids multi-GB CUDA wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
