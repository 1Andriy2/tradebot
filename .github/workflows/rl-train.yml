# RL training on CPU, nightly, each night from a new seed. Large runs use notebooks/rl_kaggle.ipynb.
name: RL train (CPU)

# Triggered by Supabase Cron (supabase/migrations/20261101180000_cron_dispatch.sql)
# via workflow_dispatch; GitHub's own schedule never fired for this repository.
on:
  workflow_dispatch:
    inputs:
      timesteps:
        description: "PPO timesteps"
        default: "3000000"

permissions:
  contents: read

concurrency:
  group: rl-train
  cancel-in-progress: false

jobs:
  rl:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --extra ml --extra rl --extra db --frozen
      - name: Train PPO
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXCHANGE_ID: ${{ vars.EXCHANGE_ID || 'okx' }}  # market data source for cache updates
          SEED: ${{ github.run_number }}
          TIMESTEPS: ${{ inputs.timesteps || '3000000' }}
        run: uv run tradebot rl-train --sync --no-download --device cpu --timesteps "$TIMESTEPS" --seed "$SEED"
