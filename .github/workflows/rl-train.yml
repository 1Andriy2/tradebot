# Small-budget RL training on CPU (weekly). Large runs use notebooks/rl_kaggle.ipynb.
name: RL train (CPU)

# Triggered by Supabase Cron (supabase/migrations/20261101180000_cron_dispatch.sql)
# via workflow_dispatch; GitHub's own schedule never fired for this repository.
on:
  workflow_dispatch:
    inputs:
      timesteps:
        description: "PPO timesteps"
        default: "300000"

permissions:
  contents: read

jobs:
  rl:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --extra ml --extra rl --extra db --frozen
      - name: Train PPO
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXCHANGE_ID: ${{ vars.EXCHANGE_ID || 'okx' }}  # market data source for cache updates
          TIMESTEPS: ${{ inputs.timesteps || '300000' }}
        run: uv run tradebot rl-train --sync --no-download --device cpu --timesteps "$TIMESTEPS"
