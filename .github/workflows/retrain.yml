# Nightly retraining (LightGBM walk-forward + champion/challenger) and DB housekeeping.
name: Nightly retrain

# Triggered by Supabase Cron (supabase/migrations/20261101180000_cron_dispatch.sql)
# via workflow_dispatch; GitHub's own schedule never fired for this repository.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EXCHANGE_ID: ${{ vars.EXCHANGE_ID || 'okx' }}  # market data source for cache updates
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --extra ml --extra rl --extra db --frozen
      - name: Retrain LightGBM
        run: uv run tradebot retrain --sync
      - name: Prune old rows (free-tier storage)
        run: uv run tradebot maintenance
