# Manual check: which news sources can GitHub-hosted runners reach? Uses no secrets.
name: News source check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run tradebot news --check
