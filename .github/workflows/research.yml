# Nightly walk-forward scan of all strategy families + recurring-pattern statistics.
name: Nightly research

# Triggered by Supabase Cron (supabase/migrations/20261101180000_cron_dispatch.sql)
# via workflow_dispatch; GitHub's own schedule never fired for this repository.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EXCHANGE_ID: ${{ vars.EXCHANGE_ID || 'okx' }}  # market data source for cache updates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --extra ml --extra db --frozen
      - name: Research scan
        run: uv run tradebot research --sync --workers 4
