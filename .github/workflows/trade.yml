# Cron mode: one trading step per closed 15m candle. The bot starts, trades, exits.
name: Trade step

# Triggered by Supabase Cron (supabase/migrations/20261101180000_cron_dispatch.sql)
# via workflow_dispatch; GitHub's own schedule never fired for this repository.
on:
  workflow_dispatch:
    inputs:
      shadow_only:
        description: "Paper agents only (no demo orders)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: trade-step
  cancel-in-progress: false

jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --extra ml --extra rl --extra db --frozen
      - name: Trading step
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXCHANGE_ID: ${{ vars.EXCHANGE_ID || 'okx' }}  # Bybit blocks GitHub runners (HTTP 403)
          EXCHANGE_API_KEY: ${{ secrets.EXCHANGE_API_KEY }}
          EXCHANGE_API_SECRET: ${{ secrets.EXCHANGE_API_SECRET }}
          EXCHANGE_API_PASSPHRASE: ${{ secrets.EXCHANGE_API_PASSPHRASE }}
          SHADOW_ONLY: ${{ inputs.shadow_only }}
        run: |
          if [ "$SHADOW_ONLY" = "true" ]; then
            uv run tradebot step --shadow-only
          else
            uv run tradebot step
          fi
      # Paper only, so it gets no exchange keys. It runs even after a failed step: the two are separate.
      - name: Daily basket
        if: success() || failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXCHANGE_ID: ${{ vars.EXCHANGE_ID || 'okx' }}
        run: uv run tradebot basket
