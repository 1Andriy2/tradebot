# News risk filter: collect, score, work out the risk level. Only a shadow agent reads it.
name: News step

# Triggered by Supabase Cron (supabase/migrations/20261105120000_news_cron.sql).
# This job reads untrusted text, so it gets no exchange keys.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news-step
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --extra db --frozen
      - name: News step
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: uv run tradebot news
